# render.yaml — deploy to Render.com
services:
  - type: web
    name: neural-reminder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false   # set in Render dashboard
