services:
  - type: web
    name: neural-reminder-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false        # You set this manually in Render dashboard
      - key: FLASK_ENV
        value: production