<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--bg2:#0d1220;--glass:rgba(255,255,255,.04);
  --glass-b:rgba(255,255,255,.08);--border:rgba(255,255,255,.07);
  --border-h:rgba(255,255,255,.14);--accent:#6ee7b7;--accent2:#38bdf8;
  --danger:#f87171;--text:#f1f5f9;--text-muted:#64748b;--text-dim:#94a3b8;
  --radius:14px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative}

/* background glow blobs */
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);opacity:.12}
body::before{width:500px;height:500px;background:var(--accent);top:-100px;left:-100px}
body::after{width:400px;height:400px;background:var(--accent2);bottom:-80px;right:-80px}

.card{
  background:rgba(13,18,32,.95);border:1px solid var(--border);
  border-radius:24px;padding:44px 40px;width:100%;max-width:400px;
  position:relative;z-index:1;
  box-shadow:0 0 60px rgba(110,231,183,.06),0 24px 64px rgba(0,0,0,.5);
  animation:scale-in .35s cubic-bezier(.34,1.56,.64,1) both;
}

.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px}
.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent),0 0 24px rgba(110,231,183,.4);
  animation:pulse 2.5s ease-in-out infinite}
.brand-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}

.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:10px;padding:3px;margin-bottom:28px}
.tab{flex:1;padding:9px;text-align:center;border-radius:8px;font-size:13.5px;
  font-weight:500;cursor:pointer;color:var(--text-muted);transition:all .2s;border:none;background:transparent}
.tab.active{background:var(--glass-b);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);
  border:1px solid var(--border-h);border-radius:10px;color:var(--text);
  font-size:14.5px;font-family:'DM Sans',sans-serif;outline:none;transition:all .2s}
input:focus{border-color:rgba(110,231,183,.4);box-shadow:0 0 0 3px rgba(110,231,183,.07)}
input::placeholder{color:var(--text-muted)}

.btn{width:100%;padding:13px;margin-top:8px;border-radius:11px;border:none;
  background:var(--accent);color:#001;font-size:15px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
.btn:hover{background:#a7f3d0;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);
  border-radius:9px;padding:10px 14px;font-size:13px;color:var(--danger);
  margin-bottom:14px;display:none}

.divider{text-align:center;font-size:12px;color:var(--text-muted);margin:20px 0 4px}

@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
@keyframes scale-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Neural</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('register')">Sign Up</button>
  </div>

  <div id="errorBox" class="error"></div>

  <!-- Login form -->
  <div id="loginForm">
    <div class="field">
      <label>Username</label>
      <input id="loginUser" type="text" placeholder="your username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" onclick="login()">Sign In →</button>
  </div>

  <!-- Register form -->
  <div id="registerForm" style="display:none">
    <div class="field">
      <label>Username</label>
      <input id="regUser" type="text" placeholder="choose a username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="regPass" type="password" placeholder="min 6 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input id="regPass2" type="password" placeholder="repeat password" autocomplete="new-password">
    </div>
    <button class="btn" onclick="register()">Create Account →</button>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('loginForm').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0)===(tab==='login')));
  hideError();
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent = msg; b.style.display = 'block';
}
function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

async function login() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return showError('Please fill in all fields');
  const btn = document.querySelector('#loginForm .btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const d = await r.json();
    if (d.success) { window.location.href = '/'; }
    else { showError(d.error || 'Login failed'); btn.disabled=false; btn.textContent='Sign In →'; }
  } catch(e) { showError('Network error'); btn.disabled=false; btn.textContent='Sign In →'; }
}

async function register() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const confirm  = document.getElementById('regPass2').value;
  if (!username || !password) return showError('Please fill in all fields');
  if (password !== confirm)   return showError('Passwords do not match');
  const btn = document.querySelector('#registerForm .btn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const d = await r.json();
    if (d.success) { window.location.href = '/'; }
    else { showError(d.error || 'Registration failed'); btn.disabled=false; btn.textContent='Create Account →'; }
  } catch(e) { showError('Network error'); btn.disabled=false; btn.textContent='Create Account →'; }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const isLogin = document.getElementById('loginForm').style.display !== 'none';
    isLogin ? login() : register();
  }
});
</script>
</body>
</html>
